<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outbox — the email client with no inbox</title>
<meta name="description" content="Your agent reads everything. You only ever see what's about to go out." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b; --bg2:#0d0f13; --card:#12151b; --card2:#171b23;
  --line:#1e232d; --line2:#2a313d;
  --txt:#e8eaf0; --dim:#8b93a5; --dim2:#5b6373;
  --acc:#7c8cff; --acc2:#a78bfa;
  --ok:#3fd68c; --warn:#ffb545; --hot:#ff6b6b; --wait:#5eb8ff;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:Inter,-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(124,140,255,.13), transparent 60%),
    radial-gradient(800px 500px at 92% 4%, rgba(167,139,250,.10), transparent 60%),
    radial-gradient(700px 600px at 50% 110%, rgba(94,184,255,.06), transparent 60%);
}
#root{position:relative;z-index:1}

/* ---------- BOOT / AGENT SORT ANIMATION ---------- */
.boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .7s ease, visibility .7s}
.boot.gone{opacity:0;visibility:hidden;pointer-events:none}
.bootMark{font-family:'Instrument Serif',serif;font-size:64px;letter-spacing:-.02em;margin-bottom:6px}
.bootMark em{font-style:italic;background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bootSub{color:var(--dim);font-size:14px;letter-spacing:.02em;margin-bottom:38px}
.bootLog{width:440px;max-width:88vw;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:2.1;color:var(--dim2)}
.bootLog div{opacity:0;transform:translateY(4px);animation:bl .45s forwards}
.bootLog b{color:var(--acc);font-weight:500}
.bootLog i{color:var(--ok);font-style:normal}
@keyframes bl{to{opacity:1;transform:none}}
.bootBar{width:440px;max-width:88vw;height:2px;background:var(--line);border-radius:2px;margin-top:26px;overflow:hidden}
.bootBar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:bb 3.1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes bb{to{width:100%}}

/* ---------- SHELL ---------- */
.wrap{max-width:1580px;margin:0 auto;padding:26px 30px 90px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px}
.logo{font-family:'Instrument Serif',serif;font-size:34px;letter-spacing:-.02em}
.logo em{font-style:italic;background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--dim2);font-size:12.5px;letter-spacing:.01em;padding-bottom:2px}
.acct{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--dim)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(63,214,140,.14);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff}

/* ---------- BRIEF ---------- */
.brief{display:flex;align-items:center;gap:34px;padding:24px 0 26px;flex-wrap:wrap}
.briefLine{font-family:'Instrument Serif',serif;font-size:29px;line-height:1.3;letter-spacing:-.01em;flex:1;min-width:340px}
.briefLine b{font-family:Inter,sans-serif;font-size:26px;font-weight:600;background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.briefLine span{color:var(--dim)}
.stats{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.stat{padding:14px 22px;border-right:1px solid var(--line);min-width:104px}
.stat:last-child{border-right:0}
.statN{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.statL{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.09em;margin-top:3px}

/* ---------- BOARD ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
@media(max-width:1180px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.board{grid-template-columns:1fr}}
.lane{background:linear-gradient(180deg,var(--bg2),rgba(13,15,19,.4));border:1px solid var(--line);border-radius:18px;padding:15px 13px 13px;min-height:220px;transition:border-color .25s}
.lane:hover{border-color:var(--line2)}
.laneHd{display:flex;align-items:center;gap:9px;padding:2px 4px 14px}
.laneDot{width:7px;height:7px;border-radius:2px;flex:none}
.laneT{font-size:12.5px;font-weight:600;letter-spacing:.01em}
.laneC{margin-left:auto;font-size:11px;color:var(--dim2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.laneSub{font-size:11px;color:var(--dim2);padding:0 4px 13px;line-height:1.5;margin-top:-8px}

/* ---------- CARD ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.4,.5,1),border-color .18s,background .18s;position:relative;overflow:hidden;
  opacity:0;transform:translateY(14px) scale(.97);animation:in .5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--card2)}
.card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c,transparent);opacity:.85}
.cHd{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cAv{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none;color:#0a0b0d}
.cFrom{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cOrg{font-size:10.5px;color:var(--dim2);margin-top:1px}
.cTime{margin-left:auto;font-size:10.5px;color:var(--dim2);flex:none}
.cSub{font-size:13.5px;font-weight:500;line-height:1.4;margin-bottom:7px;letter-spacing:-.005em}
.cSum{font-size:12px;color:var(--dim);line-height:1.55;margin-bottom:11px}
.cSum b{color:var(--txt);font-weight:500}
.why{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim2);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:7px;padding:4px 8px;line-height:1.3}
.why svg{flex:none;opacity:.7}

/* drafted reply block */
.draft{background:rgba(124,140,255,.055);border:1px solid rgba(124,140,255,.2);border-radius:11px;padding:10px 11px;margin:2px 0 10px}
.draftHd{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--acc);text-transform:uppercase;letter-spacing:.09em;font-weight:600;margin-bottom:7px}
.draftTx{font-size:12px;line-height:1.6;color:#c9cee0;font-family:Inter}
.acts{display:flex;gap:7px;margin-top:10px}
.btn{flex:1;border:1px solid var(--line2);background:var(--card2);color:var(--txt);border-radius:9px;padding:8px 10px;font-size:11.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:.16s;display:flex;align-items:center;justify-content:center;gap:5px}
.btn:hover{background:#20252f;border-color:#3a4250}
.btn.pri{background:linear-gradient(100deg,var(--acc),var(--acc2));border-color:transparent;color:#0a0b12;font-weight:600}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gh{flex:none;padding:8px 11px;background:transparent}

/* quick reply */
.qr{margin-top:9px;display:flex;gap:7px;align-items:center}
.qr input{flex:1;background:#0b0d11;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);font-size:12px;font-family:inherit;outline:none;transition:.16s}
.qr input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,140,255,.12)}
.qr input::placeholder{color:var(--dim2)}
.send{width:34px;height:34px;flex:none;border-radius:9px;border:0;background:linear-gradient(100deg,var(--acc),var(--acc2));display:grid;place-items:center;cursor:pointer;transition:.16s}
.send:hover{filter:brightness(1.15)}
.hint{font-size:10px;color:var(--dim2);margin-top:6px;padding-left:2px}
.hint kbd{background:var(--card2);border:1px solid var(--line2);border-radius:4px;padding:1px 4px;font-family:'JetBrains Mono',monospace;font-size:9.5px}

/* sent state */
.card.sent{opacity:.42;pointer-events:none}
.sentTag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);margin-top:8px;font-weight:500}

/* ---------- HANDLED / LOG ---------- */
.logRow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:11.5px;color:var(--dim);transition:.16s;cursor:default;
  opacity:0;animation:in .45s cubic-bezier(.22,1,.36,1) forwards}
.logRow:hover{background:var(--card)}
.logIco{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:10px}
.logTx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logTx b{color:#b9c0d0;font-weight:500}
.logAct{font-size:10px;color:var(--dim2);flex:none;font-family:'JetBrains Mono',monospace}

/* ---------- DRAWER ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,5,7,.72);backdrop-filter:blur(6px);z-index:60;opacity:0;animation:fade .25s forwards}
@keyframes fade{to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--bg2);border-left:1px solid var(--line);z-index:61;overflow-y:auto;transform:translateX(100%);animation:slide .38s cubic-bezier(.22,1,.36,1) forwards;padding:26px 28px 44px}
@keyframes slide{to{transform:none}}
.dClose{position:absolute;top:20px;right:22px;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--dim);cursor:pointer;font-size:15px;line-height:1}
.dFrom{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.dAv{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:14px;color:#0a0b0d}
.dSub{font-family:'Instrument Serif',serif;font-size:27px;line-height:1.25;letter-spacing:-.01em;margin-bottom:18px}
.dBody{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;font-size:13px;line-height:1.75;color:#c2c8d8;white-space:pre-line;margin-bottom:20px}
.secT{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.secT::after{content:'';flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:11.5px;color:var(--dim);cursor:pointer;transition:.16s;font-family:inherit}
.chip:hover{border-color:var(--acc);color:var(--txt)}
.chip.on{background:rgba(124,140,255,.14);border-color:var(--acc);color:#cdd4ff}
textarea.dEdit{width:100%;min-height:150px;background:#0b0d11;border:1px solid var(--line2);border-radius:12px;padding:14px;color:var(--txt);font-size:13px;line-height:1.7;font-family:inherit;outline:none;resize:vertical}
textarea.dEdit:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,140,255,.12)}
.reason{font-size:12px;color:var(--dim);line-height:1.7;background:rgba(255,255,255,.02);border:1px solid var(--line);border-left:2px solid var(--acc);border-radius:0 11px 11px 0;padding:12px 14px}
.reason b{color:var(--txt);font-weight:500}
.dActs{display:flex;gap:9px;margin-top:18px}

/* ---------- FOOTER PITCH ---------- */
.pitch{margin-top:56px;padding-top:30px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:34px}
@media(max-width:900px){.pitch{grid-template-columns:1fr}}
.pitch h3{font-family:'Instrument Serif',serif;font-size:24px;font-weight:400;margin-bottom:11px;letter-spacing:-.01em}
.pitch p{font-size:13px;color:var(--dim);line-height:1.75}
.pitch p+p{margin-top:11px}
.pitch em{color:var(--txt);font-style:normal}
.kicker{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);font-weight:600;margin-bottom:9px}

/* live delivery */
.liveBtn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:8px 15px;font-size:12px;color:var(--txt);cursor:pointer;font-family:inherit;font-weight:500;transition:.18s}
.liveBtn:hover:not(:disabled){border-color:var(--acc);background:var(--card2)}
.liveBtn:disabled{opacity:.55;cursor:default}
.thinking{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,rgba(124,140,255,.09),rgba(167,139,250,.05));border:1px solid rgba(124,140,255,.3);border-radius:16px;padding:14px 18px;margin-bottom:16px;
  opacity:0;transform:translateY(-8px);animation:in .4s cubic-bezier(.22,1,.36,1) forwards;position:relative;overflow:hidden}
.thinking::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:bb 2.6s cubic-bezier(.4,0,.2,1) forwards}
.thAv{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#0a0b0d;flex:none}
.thTop{font-size:11px;color:var(--dim2)}
.thTop b{color:var(--txt);font-weight:500}
.thSub{font-size:14px;font-weight:500;margin-top:2px}
.thSteps{display:flex;gap:9px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim2);flex-wrap:wrap;justify-content:flex-end}
.thSteps span{opacity:0;animation:bl .4s forwards;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.thSteps span:last-child{color:var(--acc);border-color:rgba(124,140,255,.4)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:12px 18px;font-size:12.5px;z-index:90;display:flex;align-items:center;gap:9px;box-shadow:0 16px 50px rgba(0,0,0,.6);transition:transform .34s cubic-bezier(.22,1,.36,1)}
.toast.up{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ================= DATA ================= */
const hue = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; };
const av  = s => `hsl(${hue(s)} 62% 68%)`;
const ini = s => s.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

const LANES = [
  {id:'you',   t:'Needs you',    c:'var(--hot)',  sub:'A real decision. The agent will not guess.'},
  {id:'ready', t:'Reply ready',  c:'var(--acc)',  sub:'Written in your voice. Read it, tap send.'},
  {id:'wait',  t:'Waiting on',   c:'var(--wait)', sub:'Sent. The agent is watching for the reply.'},
  {id:'done',  t:'Handled',      c:'var(--ok)',   sub:'Done while you slept. Nothing needed.'},
];

const MAIL = [
  { id:1, lane:'you', from:'Priya Raghavan', org:'Sequoia Capital', time:'7:12am',
    sub:'Partner meeting — Tuesday or Thursday?',
    sum:'She can do <b>Tue 2pm</b> or <b>Thu 10am</b>. Both are open on your calendar. Thursday collides with your Motel4 pilot call, which you flagged as immovable.',
    why:'Only you can trade a pilot call for a partner meeting.',
    body:`Ilia,\n\nGreat call last week. I'd like to bring you in front of the full partnership.\n\nWe have Tuesday 2pm or Thursday 10am. Either works on our side — whichever is easier for you.\n\nCome ready to walk through the hotel pilot numbers.\n\nBest,\nPriya`,
    reason:'Both slots are free, so this is not a scheduling problem — it is a priority call. Thursday overlaps the Sunset Inn pilot, which you marked <b>do not move</b> on Aug 24. I will not silently reschedule revenue.',
    draft:'Tuesday 2pm works — I\'ll come with the pilot numbers and the call recordings. Looking forward to it.'},

  { id:2, lane:'you', from:'Marcus Bell', org:'Sunset Inn — 32 rooms', time:'6:48am',
    sub:'We want to go live, but on a discount',
    sum:'Ready to sign. Asking <b>$180/mo instead of $299</b>, citing budget. This is your third pilot asking for the same cut.',
    why:'Pricing is yours. The agent flagged the pattern, not the answer.',
    body:`Hi Ilia,\n\nThe team loved the two-week trial — we caught 41 calls we would have missed.\n\nOne thing: $299 is above what we budgeted. Could you do $180/month? If so I can sign today.\n\nMarcus`,
    reason:'Third pilot in nine days anchoring at the same number. That is a <b>price signal, not a negotiation</b>. Deciding this once sets your floor, so I am not drafting a yes or a no.',
    draft:'41 missed calls in two weeks is roughly $8k of bookings. Let\'s hold $299 and I\'ll add the after-hours routing at no charge.'},

  { id:3, lane:'ready', from:'Elijah-Justin Leano', org:'IxDF San Francisco', time:'5:23pm',
    sub:'Venue address correction — 530 Howard St',
    sum:'Address typo fixed: <b>530 Howard St, Suite 300</b>. Doors at 5:30. You are on the builder list.',
    why:'Confirmation only. Nothing at stake.',
    body:`Sorry there was also a typo on the address. Here is the actual address:\n\n📍 Venue: 530 Howard St, Suite 300\n\nDoors open at 5:30pm. If the gate is locked, message me.`,
    reason:'Logistics acknowledgement. No commitment, no money, no new obligation — safe to answer in your voice.',
    draft:'Got it — 530 Howard, Suite 300. See you at 5:30.'},

  { id:4, lane:'ready', from:'Dana Whitfield', org:'Harborview Suites', time:'Yesterday',
    sub:'Can it answer in Spanish?',
    sum:'Pre-sale question about Spanish support. <b>You shipped it on Aug 19</b> — the agent pulled the answer from your own changelog.',
    why:'Answer already exists in your docs.',
    body:`Hi — about half our callers speak Spanish first. Does your receptionist handle that, or does it hand off?`,
    reason:'I checked your changelog rather than guessing. Spanish shipped <b>Aug 19</b> with automatic language detection on the first sentence, so the answer is a fact I can cite, not a promise I invented.',
    draft:'Yes — it detects the caller\'s language in the first sentence and answers in Spanish natively, no handoff. Happy to run a live test call on your line this week.'},

  { id:5, lane:'ready', from:'Tomás Herrera', org:'Cedar Motor Lodge', time:'Yesterday',
    sub:'Invoice #1043 — wrong billing address',
    sum:'Billing address on the invoice is stale. Correct one is <b>already in your CRM</b>. The agent drafted the fix and the reissue.',
    why:'Mechanical correction, verified against your CRM.',
    body:`The invoice has our old address on it. Can you reissue with 1120 Cedar Ave, Bakersfield CA 93301?`,
    reason:'The address he gave matches the record updated in your CRM on Aug 11, so the two sources agree. Reissuing an invoice is reversible, which is why this sits in Reply ready and not in Needs you.',
    draft:'Fixed — reissuing #1043 to 1120 Cedar Ave, Bakersfield CA 93301. New copy is on its way now.'},

  { id:6, lane:'wait', from:'Rachel Kim', org:'Y Combinator', time:'2d ago',
    sub:'S26 application — interview scheduling',
    sum:'You replied Tuesday with availability. <b>No response in 48h.</b> Agent will nudge Friday 9am unless you stop it.',
    why:'Follow-up armed, not yet fired.',
    body:`Thanks for applying. We're scheduling interviews for the week of the 8th — send over a few windows.`,
    reason:'You answered on Aug 26 and nothing came back. Standard YC turnaround is 2–4 days, so a nudge before Friday reads as anxious rather than diligent. I am holding it.',
    draft:'Following up on the windows I sent Tuesday — still open on all three. Happy to work around your side.'},

  { id:7, lane:'wait', from:'Sam Ortega', org:'Twilio Support', time:'3d ago',
    sub:'Ticket #88214 — SIP trunk latency',
    sum:'Escalated to tier 2. Their <b>SLA expires tomorrow 4pm</b>. Agent is holding the clock and will chase automatically.',
    why:'Vendor clock tracked to the minute.',
    body:`Your ticket has been escalated to our voice engineering team. Expect an update within 72 hours.`,
    reason:'I read the 72-hour window off their own reply and put it on a timer. If nothing lands by <b>4pm tomorrow</b> I chase, and the chase quotes their SLA back at them.',
    draft:'Checking in on #88214 — the 72-hour window from your escalation note closes at 4pm today. What\'s the current status?'},
];

const HANDLED = [
  {t:'<b>Stripe</b> — payout $4,120 cleared', a:'filed', k:'ok'},
  {t:'<b>LinkedIn</b> — 14 connection digests', a:'archived', k:'mute'},
  {t:'<b>Notion</b> — 6 comment notifications', a:'batched', k:'mute'},
  {t:'<b>Anthropic</b> — usage report, nothing anomalous', a:'filed', k:'ok'},
  {t:'<b>Delta</b> — SFO→AUS boarding pass', a:'to wallet', k:'ok'},
  {t:'<b>3 recruiters</b> — declined in your voice', a:'replied', k:'sent'},
  {t:'<b>Vercel</b> — deploy succeeded, motel4.ai', a:'filed', k:'ok'},
  {t:'<b>“Final notice” SEO spam</b> ×9', a:'blocked', k:'mute'},
  {t:'<b>Twenty CRM</b> — 22 new leads synced', a:'filed', k:'ok'},
  {t:'<b>Apple</b> — receipt, $2.99', a:'filed', k:'ok'},
  {t:'<b>Calendly</b> — Thu 3pm confirmed', a:'on calendar', k:'ok'},
  {t:'<b>2 newsletters</b> — nothing you follow', a:'unsubbed', k:'mute'},
];

/* live-arrival demo: a new mail lands and the agent sorts it on stage */
const INCOMING = [
  { id:101, lane:'ready', from:'Grace Nakamura', org:'Bayside Lodge', time:'just now',
    sub:'Do you integrate with Cloudbeds?',
    sum:'Pre-sale integration question. <b>Cloudbeds shipped Aug 6</b> — pulled from your own integrations page.',
    why:'Answer already exists in your docs.',
    body:`Hi — we run Cloudbeds for our PMS. Does your receptionist push bookings into it directly?`,
    reason:'Checked your integrations page rather than guessing. Cloudbeds went live <b>Aug 6</b> with two-way booking sync, so this is a citable fact, not a promise.',
    draft:'Yes — two-way sync with Cloudbeds since Aug 6, bookings land directly in your PMS. Want me to run a test booking on your account?'},
  { id:102, lane:'you', from:'Devin Alvarez', org:'Alvarez Hospitality Group', time:'just now',
    sub:'Exclusive for 11 properties — 12 months',
    sum:'Wants an <b>exclusivity clause</b> across 11 properties in exchange for a 12-month prepay. That locks out the rest of the region.',
    why:'Exclusivity is a strategy call. No draft written.',
    body:`Ilia — we'd prepay 12 months across all 11 properties if you give us regional exclusivity for the year.`,
    reason:'Prepay is attractive, but exclusivity <b>removes every other hotel in the region</b> from your pipeline for a year. That trade is yours to make, so I wrote nothing.',
    draft:'Prepay is interesting. Exclusivity I need to think about — can we do volume pricing without the regional lock?'},
];

const TONES = ['Your default','Warmer','Shorter','Firmer','More formal'];
const RETONE = {
  'Warmer':t=>t.replace(/^/, 'Thanks for the nudge — ').replace(/\.$/,'. Really appreciate it.'),
  'Shorter':t=>t.split(/[.—]/)[0].trim()+'.',
  'Firmer':t=>t.replace(/Happy to|happy to/,'I\'ll').replace(/^/, ''),
  'More formal':t=>'Hi,\n\n'+t+'\n\nBest regards,\nIlia',
};

/* ================= BOOT ================= */
function Boot(){
  const lines=[
    'connecting <b>agentmail</b> inbox … <i>ok</i>',
    'reading <b>47</b> messages since 11:04pm',
    'resolving threads against calendar + CRM',
    'scoring each against your <b>TELOS</b> …',
    '<i>41 handled</i> · 4 drafted · 2 need you',
    'nothing was deleted. nothing was sent.',
  ];
  return (
    <div className="boot" id="boot">
      <div className="bootMark">Out<em>box</em></div>
      <div className="bootSub">the email client with no inbox</div>
      <div className="bootLog">
        {lines.map((l,i)=><div key={i} style={{animationDelay:(i*.42)+'s'}} dangerouslySetInnerHTML={{__html:l}}/>)}
      </div>
      <div className="bootBar"><span/></div>
    </div>
  );
}

/* ================= CARD ================= */
function Card({m,i,onOpen,onSend}){
  const [q,setQ]=useState('');
  const [sent,setSent]=useState(false);
  const fire=(txt)=>{ setSent(true); onSend(txt||m.draft,m.from); };
  const c = LANES.find(l=>l.id===m.lane).c;
  return (
    <div className={'card'+(sent?' sent':'')} style={{'--c':c,animationDelay:(i*.06)+'s'}} onClick={e=>{if(!e.target.closest('button,input'))onOpen(m)}}>
      <div className="cHd">
        <div className="cAv" style={{background:av(m.from)}}>{ini(m.from)}</div>
        <div style={{minWidth:0}}>
          <div className="cFrom">{m.from}</div>
          <div className="cOrg">{m.org}</div>
        </div>
        <div className="cTime">{m.time}</div>
      </div>
      <div className="cSub">{m.sub}</div>
      <div className="cSum" dangerouslySetInnerHTML={{__html:m.sum}}/>

      {m.lane==='ready' && !sent && (
        <div className="draft">
          <div className="draftHd">✎ drafted in your voice</div>
          <div className="draftTx">{m.draft}</div>
        </div>
      )}

      <div className="why">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
        {m.why}
      </div>

      {sent && <div className="sentTag">✓ Sent · thread muted until they reply</div>}

      {!sent && m.lane==='ready' && (
        <div className="acts">
          <button className="btn pri" onClick={()=>fire()}>Send</button>
          <button className="btn" onClick={()=>onOpen(m)}>Edit</button>
        </div>
      )}

      {!sent && m.lane==='you' && (
        <>
          <div className="qr">
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Tell it what you decided…"
              onKeyDown={e=>{if(e.key==='Enter'&&q.trim())fire(q)}}/>
            <button className="send" onClick={()=>q.trim()&&fire(q)}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0a0b12" strokeWidth="2.4" strokeLinecap="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
            </button>
          </div>
          <div className="hint">Type the decision, not the email. It writes the rest. <kbd>↵</kbd></div>
        </>
      )}

      {!sent && m.lane==='wait' && (
        <div className="acts">
          <button className="btn" onClick={()=>fire()}>Nudge now</button>
          <button className="btn gh" onClick={()=>onOpen(m)}>Why</button>
        </div>
      )}
    </div>
  );
}

/* ================= DRAWER ================= */
function Drawer({m,onClose,onSend}){
  const [tone,setTone]=useState('Your default');
  const [txt,setTxt]=useState(m.draft);
  const pick=t=>{ setTone(t); setTxt(t==='Your default'?m.draft:(RETONE[t]?RETONE[t](m.draft):m.draft)); };
  useEffect(()=>{const h=e=>e.key==='Escape'&&onClose();addEventListener('keydown',h);return()=>removeEventListener('keydown',h)},[]);
  return (<>
    <div className="scrim" onClick={onClose}/>
    <div className="drawer">
      <button className="dClose" onClick={onClose}>✕</button>
      <div className="dFrom">
        <div className="dAv" style={{background:av(m.from)}}>{ini(m.from)}</div>
        <div>
          <div style={{fontSize:14,fontWeight:500}}>{m.from}</div>
          <div style={{fontSize:12,color:'var(--dim2)'}}>{m.org} · {m.time}</div>
        </div>
      </div>
      <div className="dSub">{m.sub}</div>
      <div className="dBody">{m.body}</div>

      <div className="secT">Why it landed here</div>
      <div className="reason" dangerouslySetInnerHTML={{__html:m.reason}}/>

      <div className="secT">Your reply</div>
      <div className="chips">{TONES.map(t=><button key={t} className={'chip'+(tone===t?' on':'')} onClick={()=>pick(t)}>{t}</button>)}</div>
      <textarea className="dEdit" value={txt} onChange={e=>setTxt(e.target.value)}/>
      <div className="dActs">
        <button className="btn pri" onClick={()=>{onSend(txt,m.from);onClose();}}>Send reply</button>
        <button className="btn" onClick={onClose}>Keep waiting</button>
      </div>
    </div>
  </>);
}

/* ================= APP ================= */
function App(){
  const [open,setOpen]=useState(null);
  const [toast,setToast]=useState(null);
  const [booted,setBooted]=useState(false);
  const [mail,setMail]=useState(MAIL);
  const [think,setThink]=useState(null);
  const [n,setN]=useState(0);
  const [read,setRead]=useState(47);

  useEffect(()=>{ const t=setTimeout(()=>{ setBooted(true); document.getElementById('boot')?.classList.add('gone'); },3300); return ()=>clearTimeout(t); },[]);

  const send=(txt,who)=>{ setToast('Sent to '+who.split(' ')[0]+' — thread muted until they reply'); setTimeout(()=>setToast(null),3400); };

  const arrive=()=>{
    if(think||n>=INCOMING.length) return;
    const m=INCOMING[n];
    setThink(m);
    setTimeout(()=>{
      setMail(p=>[m,...p]); setThink(null); setN(n+1); setRead(r=>r+1);
      setToast('Sorted into '+(m.lane==='you'?'Needs you':'Reply ready')+' — '+m.why.toLowerCase());
      setTimeout(()=>setToast(null),3600);
    },2600);
  };

  return (<>
    <Boot/>
    <div className="wrap" style={{opacity:booted?1:0,transition:'opacity .6s .1s'}}>
      <header className="top">
        <div className="brand">
          <div className="logo">Out<em>box</em></div>
          <div className="tag">the email client with no inbox</div>
        </div>
        <div className="acct">
          <button className="liveBtn" onClick={arrive} disabled={!!think||n>=INCOMING.length}>
            <span className="dot"/> {think?'Agent reading…':n>=INCOMING.length?'Inbox quiet':'Deliver a new email'}
          </button>
          <span className="pill">ilia@motel4.ai</span>
          <div className="av">IP</div>
        </div>
      </header>

      <div className="brief">
        <div className="briefLine">
          I read <b>47</b> messages while you slept.<br/>
          <span>Forty-one are done. Four have replies waiting. Two are yours.</span>
        </div>
        <div className="stats">
          <div className="stat"><div className="statN">{read}</div><div className="statL">Read</div></div>
          <div className="stat"><div className="statN" style={{color:'var(--ok)'}}>41</div><div className="statL">Handled</div></div>
          <div className="stat"><div className="statN" style={{color:'var(--acc)'}}>3</div><div className="statL">Drafted</div></div>
          <div className="stat"><div className="statN" style={{color:'var(--hot)'}}>2</div><div className="statL">Yours</div></div>
          <div className="stat"><div className="statN">31<span style={{fontSize:14,color:'var(--dim2)'}}>m</span></div><div className="statL">Saved</div></div>
        </div>
      </div>

      {think && (
        <div className="thinking">
          <div className="thAv" style={{background:av(think.from)}}>{ini(think.from)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div className="thTop"><b>{think.from}</b> · {think.org} · just now</div>
            <div className="thSub">{think.sub}</div>
          </div>
          <div className="thSteps">
            <span style={{animationDelay:'.1s'}}>reading</span>
            <span style={{animationDelay:'.7s'}}>checking calendar + CRM</span>
            <span style={{animationDelay:'1.4s'}}>scoring against TELOS</span>
            <span style={{animationDelay:'2.1s'}}>routing…</span>
          </div>
        </div>
      )}

      <div className="board">
        {LANES.map(l=>{
          const items = mail.filter(m=>m.lane===l.id);
          return (
            <div className="lane" key={l.id}>
              <div className="laneHd">
                <div className="laneDot" style={{background:l.c}}/>
                <div className="laneT">{l.t}</div>
                <div className="laneC">{l.id==='done'?HANDLED.length:items.length}</div>
              </div>
              <div className="laneSub">{l.sub}</div>
              {l.id==='done'
                ? HANDLED.map((h,i)=>(
                    <div className="logRow" key={i} style={{animationDelay:(i*.045)+'s'}}>
                      <div className="logIco" style={{background:h.k==='mute'?'rgba(139,147,165,.12)':h.k==='sent'?'rgba(124,140,255,.15)':'rgba(63,214,140,.13)'}}>
                        {h.k==='mute'?'⌀':h.k==='sent'?'↗':'✓'}
                      </div>
                      <div className="logTx" dangerouslySetInnerHTML={{__html:h.t}}/>
                      <div className="logAct">{h.a}</div>
                    </div>))
                : items.map((m,i)=><Card key={m.id} m={m} i={i} onOpen={setOpen} onSend={send}/>)}
            </div>);
        })}
      </div>

      <div className="pitch">
        <div>
          <div className="kicker">The idea</div>
          <h3>Every email client still makes you read.</h3>
          <p>Inbox zero, snooze, split panes, kanban lanes bolted onto Gmail — all of it is <em>faster sorting of a list you still have to read</em>. The list is the problem.</p>
          <p>Outbox deletes the list. An agent reads everything, does what is safe, drafts what is obvious, and hands you only the calls that are genuinely yours. You never see an inbox. You only ever see what is about to go out.</p>
        </div>
        <div>
          <div className="kicker">The rule</div>
          <h3>It never guesses on your behalf.</h3>
          <p>Anything that spends money, moves a commitment, or changes a price goes to <em>Needs you</em> — with the tradeoff spelled out and no draft written.</p>
          <p>Every card shows why it landed where it did. Open one and you get the agent's reasoning, cited against your calendar, your CRM, your changelog. Wrong lane is a bug you can see.</p>
        </div>
        <div>
          <div className="kicker">The interaction</div>
          <h3>Type the decision, not the email.</h3>
          <p>“Tuesday, and hold the price.” That is the whole input. The agent writes the sentences, matches your voice, and sends.</p>
          <p>Four lanes, one gesture each: <em>send</em>, <em>decide</em>, <em>wait</em>, <em>ignore</em>. Everything else the mailbox used to ask of you is gone.</p>
        </div>
      </div>
    </div>

    {open && <Drawer m={open} onClose={()=>setOpen(null)} onSend={send}/>}
    <div className={'toast'+(toast?' up':'')}>
      <span style={{color:'var(--ok)'}}>✓</span> {toast||''}
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
