<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outbox</title>
<meta name="description" content="Tell it what you need. It does the rest." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6FB; --card:#FFFFFF;
  --line:#EDEAF6; --line2:#DFDAEE;
  --txt:#17141F; --dim:#6B6584; --dim2:#A29CB4;
  --acc:#6D5CE7; --acc2:#C86DD7;
  --ok:#11B981;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;filter:blur(8px);
  background:
    radial-gradient(760px 520px at 6% -12%, rgba(200,109,215,.30), transparent 62%),
    radial-gradient(700px 480px at 40% -16%, rgba(109,92,231,.24), transparent 62%),
    radial-gradient(820px 540px at 96% 0%, rgba(62,168,245,.26), transparent 62%),
    radial-gradient(720px 620px at 74% 112%, rgba(255,183,143,.24), transparent 62%);}
#root{position:relative;z-index:1}

.wrap{max-width:620px;margin:0 auto;padding:44px 26px 120px;min-height:100vh;display:flex;flex-direction:column}
.mark{font-family:'Instrument Serif',serif;font-size:22px;letter-spacing:-.01em;color:var(--dim);text-align:center;margin-bottom:60px}
.mark em{font-style:italic;background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}

.ask{text-align:center;margin-bottom:44px}
.askQ{font-family:'Instrument Serif',serif;font-size:42px;line-height:1.2;letter-spacing:-.02em;margin-bottom:34px}
.mic{width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;margin:0 auto;box-shadow:0 14px 44px rgba(109,92,231,.36);transition:transform .25s cubic-bezier(.34,1.5,.5,1)}
.mic:hover{transform:scale(1.06)}
.mic:active{transform:scale(.96)}
.mic.on{animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 14px 44px rgba(109,92,231,.36)}50%{box-shadow:0 14px 44px rgba(109,92,231,.36),0 0 0 22px rgba(109,92,231,.07)}}
.micHint{font-size:13px;color:var(--dim2);margin-top:18px;transition:opacity .3s}

.said{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;font-size:17px;line-height:1.6;text-align:left;
  box-shadow:0 8px 32px rgba(88,70,150,.08);animation:up .45s cubic-bezier(.22,1,.36,1) both}
.cursor{display:inline-block;width:2px;height:18px;background:var(--acc);vertical-align:-3px;animation:bl .8s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}

.list{display:flex;flex-direction:column;gap:12px}
.it{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;
  box-shadow:0 4px 20px rgba(88,70,150,.06);animation:up .5s cubic-bezier(.22,1,.36,1) both;transition:box-shadow .2s,transform .2s}
.it:hover{box-shadow:0 12px 34px rgba(88,70,150,.12);transform:translateY(-2px)}
.ico{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:18px}
.itT{font-size:16px;font-weight:500;line-height:1.35}
.itS{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.45}
.itR{margin-left:auto;flex:none}
.go{border:1px solid var(--line2);background:#fff;color:var(--txt);border-radius:12px;padding:10px 15px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s}
.go:hover{background:#FAF9FE;border-color:#CFC7E8}
.go.p{background:linear-gradient(100deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(109,92,231,.28)}
.go.p:hover{filter:brightness(1.08)}
.go.x{color:var(--dim2)}
.pair{margin-left:auto;display:flex;gap:8px;flex:none}

.work{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);margin-top:5px}
.bars{display:flex;gap:2.5px;align-items:flex-end;height:12px}
.bars i{width:2.5px;background:var(--acc);border-radius:2px;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(1){height:6px}
.bars i:nth-child(2){height:11px;animation-delay:.15s}
.bars i:nth-child(3){height:8px;animation-delay:.3s}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.ghost .itT{color:var(--dim)}
.tag{font-size:13px;color:var(--ok);margin-top:4px}

.ask2{background:linear-gradient(100deg,rgba(109,92,231,.09),rgba(200,109,215,.06));border:1px solid rgba(109,92,231,.24);
  border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:12px;animation:up .45s cubic-bezier(.22,1,.36,1) both}

.learned{font-size:13px;color:var(--ok);text-align:center;padding:4px 0 14px}
.foot{margin-top:auto;padding-top:72px;text-align:center;font-family:'Instrument Serif',serif;font-size:22px;color:var(--dim2);line-height:1.55}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(90px);background:#fff;border:1px solid var(--line2);
  border-radius:14px;padding:14px 20px;font-size:14px;z-index:90;box-shadow:0 16px 46px rgba(88,70,150,.2);transition:transform .35s cubic-bezier(.22,1,.36,1)}
.toast.up{transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.askQ{font-size:32px}}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState} = React;

const SPEECH = "Here's the email of a guy I can do freelance GTM for. Here's my scheduling link. Keep following up until he responds.";

const START = [
  {id:'map', ico:'📍', bg:'rgba(62,168,245,.12)', t:'Lunch with Dana, Thursday',
   s:'Blue Bottle, 66 Mint St', act:'Open in Maps', learn:'open any address in Maps without asking',
   href:'https://maps.apple.com/?q=Blue%20Bottle%2066%20Mint%20St%20San%20Francisco'},
  {id:'cal', ico:'🗓', bg:'rgba(109,92,231,.12)', t:'Sequoia partner meeting',
   s:'Tuesday 2pm', act:'Add to calendar', learn:'add meetings you already agreed to, straight to the calendar'},
  {id:'spam', ico:'🚫', bg:'rgba(162,156,180,.14)', t:'Nine SEO pitches, blocked',
   s:'Same template, nine senders', act:'Never again', ghost:true, learn:'block cold SEO pitches on sight'},
];

function App(){
  const [rec,setRec]=useState(false);
  const [txt,setTxt]=useState('');
  const [items,setItems]=useState(START);
  const [phase,setPhase]=useState(0);
  const [toast,setToast]=useState(null);
  const [rule,setRule]=useState(null);
  const [rules,setRules]=useState([]);
  const say=m=>{setToast(m);setTimeout(()=>setToast(null),3200)};

  const talk=()=>{
    if(rec||phase>0) return;
    setRec(true);
    let i=0;
    const tick=setInterval(()=>{
      i+=2; setTxt(SPEECH.slice(0,i));
      if(i>=SPEECH.length){
        clearInterval(tick); setRec(false); setPhase(1);
        setTimeout(()=>{
          setItems(p=>[{id:'chase',ico:'✍️',bg:'rgba(200,109,215,.13)',
            t:'Writing to Oscar Bramley',s:'CEO, Lantern Stay Group',working:true},...p]);
        },700);
        setTimeout(()=>{
          setItems(p=>p.map(x=>x.id==='chase'
            ? {...x,working:false,ico:'📨',t:'Sent to Oscar Bramley',
               s:'Scheduling link attached.',tag:'Attempt 1 of 4 · next Wednesday 8am'}
            : x));
          setPhase(3);
        },4200);
      }
    },26);
  };

  return (<>
  <div className="wrap">
    <div className="mark">Out<em>box</em></div>

    <div className="ask">
      {phase===0 && <>
        <div className="askQ">What do you need?</div>
        <button className={'mic'+(rec?' on':'')} onClick={talk}>
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.9" strokeLinecap="round">
            <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
          </svg>
        </button>
        <div className="micHint" style={{opacity:rec?0:1}}>Say it once. It handles the rest.</div>
      </>}
      {txt && <div className="said">“{txt}{rec&&<span className="cursor"/>}”</div>}
    </div>

    {phase===3 && (
      <div className="ask2">
        <div className="ico" style={{background:'rgba(109,92,231,.14)'}}>💬</div>
        <div>
          <div className="itT">Text him too?</div>
          <div className="itS">You have his mobile.</div>
        </div>
        <div className="pair">
          <button className="go p" onClick={()=>{setPhase(4);say('Texted from your number.')}}>Yes</button>
          <button className="go x" onClick={()=>setPhase(4)}>No</button>
        </div>
      </div>
    )}

    {rule && rule.label && (
      <div className="ask2">
        <div className="ico" style={{background:'rgba(17,185,129,.13)'}}>↻</div>
        <div>
          <div className="itT">Always do that?</div>
          <div className="itS">I'll {rule.label}.</div>
        </div>
        <div className="pair">
          <button className="go p" onClick={()=>{setRules(r=>[...r,rule.label]);setRule(null);say('Learned. You won\'t see these again.')}}>Always</button>
          <button className="go x" onClick={()=>setRule(null)}>Just once</button>
        </div>
      </div>
    )}

    {rules.length>0 && (
      <div className="learned">It now handles {rules.length} thing{rules.length>1?'s':''} on its own.</div>
    )}

    <div className="list">
      {items.map((m,i)=>(
        <div className={'it'+(m.ghost?' ghost':'')} key={m.id} style={{animationDelay:(i*.07)+'s'}}>
          <div className="ico" style={{background:m.bg}}>{m.ico}</div>
          <div style={{minWidth:0}}>
            <div className="itT">{m.t}</div>
            {m.working
              ? <div className="work"><span className="bars"><i/><i/><i/></span> writing…</div>
              : <div className="itS">{m.s}</div>}
            {m.tag && <div className="tag">✓ {m.tag}</div>}
          </div>
          {m.act && <div className="itR">
            <button className={'go'+(m.ghost?' x':'')} onClick={()=>{
              if(m.href) window.open(m.href,'_blank'); else say(m.act+'.');
              if(m.ghost) setItems(p=>p.filter(x=>x.id!==m.id));
              setRule({id:m.id,label:m.learn});
            }}>{m.act}</button>
          </div>}
        </div>
      ))}
    </div>

    <div className="foot">You said one sentence.<br/>The rest was noise.</div>
  </div>
  <div className={'toast'+(toast?' up':'')}>{toast||''}</div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
